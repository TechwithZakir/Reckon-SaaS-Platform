<script>
(function(){
  var d=document;
  d.addEventListener('click',function(e){d.querySelectorAll('nav.main details[open]').forEach(function(x){if(!x.contains(e.target))x.open=false})});
  d.addEventListener('keydown',function(e){if(e.key==='Escape')d.querySelectorAll('nav.main details[open]').forEach(function(x){x.open=false})});
  var root=d.documentElement;
  function dark(){var a=root.getAttribute('data-theme');if(a)return a==='dark';return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}
  function paintTheme(){
    var isDark=dark(),a=root.getAttribute('data-theme');
    d.querySelectorAll('[data-theme-set]').forEach(function(b){b.setAttribute('aria-pressed',String((b.getAttribute('data-theme-set')==='dark')===isDark))});
    d.querySelectorAll('picture source[data-dark]').forEach(function(s){s.media=a?(a==='dark'?'all':'not all'):s.getAttribute('data-media')});
    var m=d.querySelector('meta[name=theme-color]');if(m)m.content=isDark?'#0b1626':'#0b78ab';
  }
  d.querySelectorAll('[data-theme-set]').forEach(function(b){b.addEventListener('click',function(){
    var v=b.getAttribute('data-theme-set');root.setAttribute('data-theme',v);try{localStorage.setItem('reckon_theme',v)}catch(e){}paintTheme();
  })});
  paintTheme();
  var sets=d.querySelectorAll('.cur-set');
  if(sets.length){
    var avail=[];sets.forEach(function(s){if(avail.indexOf(s.getAttribute('data-cur'))<0)avail.push(s.getAttribute('data-cur'))});
    var tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
    var saved=null;try{saved=localStorage.getItem('reckon_cur')}catch(e){}
    var pick=avail.indexOf(saved)>-1?saved:((tz==='Asia/Dhaka'&&avail.indexOf('BDT')>-1)?'BDT':(avail.indexOf('USD')>-1?'USD':avail[0]));
    // One set is shown per group: the chosen currency, in the chosen billing period when that currency has it.
    var cyc='Monthly';try{cyc=localStorage.getItem('reckon_cycle')||cyc}catch(e){}
    var cur=pick;
    function paint(){
      var any=false;
      d.querySelectorAll('.set-group').forEach(function(g){
        var mine=[].filter.call(g.querySelectorAll('.cur-set'),function(s){return s.getAttribute('data-cur')===cur});
        if(mine.length>1)any=true;
        var show=mine.filter(function(s){return s.getAttribute('data-cycle')===cyc})[0]||mine[0];
        g.querySelectorAll('.cur-set').forEach(function(s){s.style.display=s===show?'grid':'none'});
      });
      d.querySelectorAll('[data-cur-set]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-cur-set')===cur))});
      d.querySelectorAll('[data-cycle-set]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-cycle-set')===cyc))});
      d.querySelectorAll('.rk-cycle').forEach(function(x){x.style.display=any?'':'none'});
    }
    function showCur(v){cur=v;paint()}
    paint();
    d.querySelectorAll('[data-cur-set]').forEach(function(b){b.addEventListener('click',function(){var v=b.getAttribute('data-cur-set');try{localStorage.setItem('reckon_cur',v)}catch(e){}showCur(v)})});
    d.querySelectorAll('[data-cycle-set]').forEach(function(b){b.addEventListener('click',function(){cyc=b.getAttribute('data-cycle-set');try{localStorage.setItem('reckon_cycle',cyc)}catch(e){}paint()})});
  }
  var chat=d.querySelector('[data-chat]');
  if(chat){
    var fab=chat.querySelector('.chat-fab'),panel=chat.querySelector('.chat-panel'),form=chat.querySelector('form');
    function show(open){panel.hidden=!open;fab.setAttribute('aria-expanded',open);if(open)form.m.focus()}
    fab.addEventListener('click',function(){show(panel.hidden)});
    d.addEventListener('keydown',function(e){if(e.key==='Escape'&&!panel.hidden){show(false);fab.focus()}});
    form.addEventListener('submit',function(e){
      e.preventDefault();
      var who=form.n.value.trim(),text=(who?'Hi, I am '+who+'. ':'Hi. ')+form.m.value.trim()+' (from '+location.href+')';
      window.open('https://wa.me/'+chat.dataset.wa+'?text='+encodeURIComponent(text),'_blank','noopener');
    });
  }
})();
</script>
